<!DOCTYPE html>
<html lang="en" class="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RAG Agents</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #f6f6f4;
      --surface: #ffffff;
      --surface2: #f0efe9;
      --border: #e4e2da;
      --border2: #d0cfc5;
      --text: #1a1917;
      --text2: #6b6960;
      --text3: #9e9c92;
      --accent: #1a56db;
      --accent-hover: #1447c0;
      --accent-light: #eff4ff;
      --accent-text: #1447c0;
      --green: #0e7f5e;
      --green-bg: #eafaf4;
      --red: #c23b2a;
      --red-bg: #fdf1ef;
      --amber: #8a6200;
      --amber-bg: #fdf6e3;
      --sidebar-w: 260px;
      --radius: 10px;
      --radius-sm: 6px;
      --radius-lg: 14px;
    }

    .dark {
      --bg: #111110;
      --surface: #1c1b19;
      --surface2: #252420;
      --border: #2e2d29;
      --border2: #3d3c37;
      --text: #f0efe9;
      --text2: #a09e95;
      --text3: #6b6960;
      --accent: #4f8eff;
      --accent-hover: #6b9fff;
      --accent-light: #1a2540;
      --accent-text: #7eb3ff;
      --green: #34d39a;
      --green-bg: #0a2e20;
      --red: #f08070;
      --red-bg: #2e1410;
      --amber: #f0b830;
      --amber-bg: #2e2000;
    }

    html, body { height: 100%; overflow: hidden; }

    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--bg);
      color: var(--text);
      font-size: 14px;
      line-height: 1.5;
    }

    ::-webkit-scrollbar { width: 5px; height: 5px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--text3); }

    /* ── Layout ── */
    #app { display: flex; height: 100vh; width: 100vw; overflow: hidden; }

    /* ── Sidebar ── */
    #sidebar {
      width: var(--sidebar-w);
      min-width: var(--sidebar-w);
      max-width: var(--sidebar-w);
      background: var(--surface);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    .sidebar-head {
      padding: 20px 16px 16px;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 4px;
    }

    .logo-icon {
      width: 32px;
      height: 32px;
      background: var(--accent);
      border-radius: var(--radius-sm);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .logo-icon svg { color: #fff; }

    .logo h1 { font-size: 15px; font-weight: 600; color: var(--text); letter-spacing: -0.3px; }
    .logo-sub { font-size: 11px; color: var(--text3); font-family: 'JetBrains Mono', monospace; margin-left: 42px; }

    .sidebar-actions {
      padding: 12px 12px 0;
      flex-shrink: 0;
    }

    #btn-new-agent {
      width: 100%;
      padding: 9px 14px;
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: var(--radius-sm);
      font-family: 'DM Sans', sans-serif;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: background 0.15s;
    }

    #btn-new-agent:hover { background: var(--accent-hover); }

    .sidebar-section-label {
      padding: 14px 14px 6px;
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.8px;
      text-transform: uppercase;
      color: var(--text3);
      flex-shrink: 0;
    }

    #agents-list {
      flex: 1;
      overflow-y: auto;
      padding: 4px 8px;
      min-height: 0;
    }

    .agent-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 9px 10px;
      border-radius: var(--radius-sm);
      cursor: pointer;
      transition: background 0.12s;
      margin-bottom: 2px;
    }

    .agent-item:hover { background: var(--surface2); }
    .agent-item.active { background: var(--accent-light); }

    .agent-avatar {
      width: 32px;
      height: 32px;
      border-radius: var(--radius-sm);
      background: var(--surface2);
      border: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      font-weight: 600;
      color: var(--accent);
      flex-shrink: 0;
      font-family: 'JetBrains Mono', monospace;
    }

    .agent-item.active .agent-avatar {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
    }

    .agent-meta { flex: 1; min-width: 0; }
    .agent-name { font-size: 13px; font-weight: 500; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .agent-id { font-size: 10px; color: var(--text3); font-family: 'JetBrains Mono', monospace; }

    .agent-status {
      width: 7px; height: 7px;
      border-radius: 50%;
      background: var(--border2);
      flex-shrink: 0;
    }

    .agent-status.ready { background: var(--green); }

    .no-agents { padding: 24px 14px; text-align: center; color: var(--text3); font-size: 13px; }

    .sidebar-footer {
      padding: 12px;
      border-top: 1px solid var(--border);
      flex-shrink: 0;
    }

    .sidebar-footer label { font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.6px; color: var(--text3); display: block; margin-bottom: 5px; }

    .sidebar-footer input {
      width: 100%;
      padding: 7px 10px;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      font-size: 12px;
      color: var(--text);
      font-family: 'JetBrains Mono', monospace;
      outline: none;
      transition: border-color 0.15s;
    }

    .sidebar-footer input:focus { border-color: var(--accent); }

    /* ── Main ── */
    #main {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
      height: 100vh;
      overflow: hidden;
      background: var(--bg);
    }

    /* ── Top Bar ── */
    #topbar {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 0 20px;
      height: 56px;
      display: flex;
      align-items: center;
      gap: 12px;
      flex-shrink: 0;
    }

    #agent-avatar-hdr {
      width: 36px;
      height: 36px;
      border-radius: var(--radius-sm);
      background: var(--accent);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      font-weight: 600;
      font-family: 'JetBrains Mono', monospace;
      flex-shrink: 0;
    }

    #agent-name-hdr { font-size: 15px; font-weight: 600; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    #agent-id-hdr { font-size: 11px; color: var(--text3); font-family: 'JetBrains Mono', monospace; }

    .topbar-right { margin-left: auto; display: flex; align-items: center; gap: 8px; flex-shrink: 0; }

    .btn-icon {
      width: 34px; height: 34px;
      border: 1px solid var(--border);
      background: transparent;
      border-radius: var(--radius-sm);
      display: flex; align-items: center; justify-content: center;
      cursor: pointer;
      color: var(--text2);
      transition: all 0.12s;
    }

    .btn-icon:hover { background: var(--surface2); color: var(--text); }
    .btn-icon.danger:hover { background: var(--red-bg); color: var(--red); border-color: var(--red); }

    /* ── Tabs ── */
    #tabs {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      display: flex;
      padding: 0 20px;
      gap: 0;
      flex-shrink: 0;
    }

    .tab-btn {
      padding: 12px 16px;
      font-family: 'DM Sans', sans-serif;
      font-size: 13px;
      font-weight: 500;
      color: var(--text3);
      background: transparent;
      border: none;
      border-bottom: 2px solid transparent;
      cursor: pointer;
      transition: color 0.15s, border-color 0.15s;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .tab-btn:hover { color: var(--text); }
    .tab-btn.active { color: var(--accent); border-bottom-color: var(--accent); }

    /* ── Tab Content ── */
    .tab-content { display: none; flex: 1; min-height: 0; overflow: hidden; }
    .tab-content.active { display: flex; flex-direction: column; }

    /* ── Files Tab ── */
    #tab-files.active { overflow-y: auto; padding: 24px; display: block; }

    .index-bar {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 16px 20px;
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 24px;
      flex-wrap: wrap;
    }

    .index-status { display: flex; align-items: center; gap: 8px; }
    .index-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--border2); flex-shrink: 0; }
    .index-dot.ready { background: var(--green); box-shadow: 0 0 0 3px var(--green-bg); }
    .index-status-text { font-size: 13px; font-weight: 500; color: var(--text2); }
    .index-status-text.ready { color: var(--green); }
    .index-chunks { font-size: 12px; color: var(--text3); font-family: 'JetBrains Mono', monospace; }

    #btn-index {
      margin-left: auto;
      padding: 8px 18px;
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: var(--radius-sm);
      font-family: 'DM Sans', sans-serif;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: background 0.15s;
      flex-shrink: 0;
    }

    #btn-index:hover { background: var(--accent-hover); }
    #btn-index:disabled { opacity: 0.6; cursor: not-allowed; }

    .section-label {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.7px;
      color: var(--text3);
      margin-bottom: 10px;
    }

    .upload-zone {
      border: 1.5px dashed var(--border2);
      border-radius: var(--radius-lg);
      padding: 36px 24px;
      text-align: center;
      cursor: pointer;
      transition: all 0.15s;
      background: var(--surface);
      margin-bottom: 24px;
    }

    .upload-zone:hover, .upload-zone.dragover {
      border-color: var(--accent);
      background: var(--accent-light);
    }

    .upload-zone svg { color: var(--text3); margin-bottom: 10px; }
    .upload-zone p { font-size: 14px; color: var(--text2); font-weight: 500; margin-bottom: 4px; }
    .upload-zone small { font-size: 12px; color: var(--text3); font-family: 'JetBrains Mono', monospace; }

    .file-item {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 11px 14px;
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 6px;
      transition: border-color 0.12s;
    }

    .file-item:hover { border-color: var(--border2); }

    .file-ext {
      font-size: 10px;
      font-weight: 600;
      font-family: 'JetBrains Mono', monospace;
      padding: 3px 7px;
      border-radius: 4px;
      flex-shrink: 0;
    }

    .ext-pdf { background: var(--red-bg); color: var(--red); }
    .ext-txt, .ext-md { background: var(--green-bg); color: var(--green); }
    .ext-csv { background: var(--amber-bg); color: var(--amber); }
    .ext-html, .ext-htm { background: #fff3e0; color: #e65100; }
    .dark .ext-html, .dark .ext-htm { background: #2e1a00; color: #ff9040; }
    .ext-docx { background: var(--accent-light); color: var(--accent-text); }
    .ext-default { background: var(--surface2); color: var(--text2); }

    .file-name { flex: 1; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--text); }
    .file-size { font-size: 11px; color: var(--text3); font-family: 'JetBrains Mono', monospace; flex-shrink: 0; }

    .btn-delete-file {
      width: 28px; height: 28px;
      border: none;
      background: transparent;
      border-radius: 5px;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer;
      color: var(--text3);
      flex-shrink: 0;
      transition: all 0.12s;
    }

    .btn-delete-file:hover { background: var(--red-bg); color: var(--red); }

    /* ── Chat Tab ── */
    #tab-chat.active {
      display: flex;
      flex-direction: column;
      flex: 1;
      min-height: 0;
      overflow: hidden;
    }

    /* Conversation bar */
    .conv-bar {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 10px 20px;
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
      flex-wrap: wrap;
      gap: 8px;
    }

    .conv-bar svg { color: var(--text3); flex-shrink: 0; }

    .conv-bar select {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 6px 10px;
      font-family: 'DM Sans', sans-serif;
      font-size: 12px;
      color: var(--text);
      outline: none;
      cursor: pointer;
      flex-shrink: 0;
    }

    .btn-sm {
      padding: 6px 12px;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      font-family: 'DM Sans', sans-serif;
      font-size: 12px;
      font-weight: 500;
      color: var(--text2);
      cursor: pointer;
      display: flex; align-items: center; gap: 5px;
      transition: all 0.12s;
      flex-shrink: 0;
    }

    .btn-sm:hover { border-color: var(--accent); color: var(--accent); background: var(--accent-light); }

    /* ─── MESSAGES — THE KEY FIX ─── */
    #messages {
      flex: 1;
      overflow-y: auto;
      overflow-x: hidden;
      padding: 24px 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      min-height: 0;   /* critical for flex children to shrink */
    }

    .msg-row { display: flex; gap: 10px; align-items: flex-start; }
    .msg-row.user { flex-direction: row-reverse; }

    .msg-avatar {
      width: 30px; height: 30px;
      border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      font-size: 11px; font-weight: 600;
      flex-shrink: 0;
      font-family: 'JetBrains Mono', monospace;
    }

    .msg-avatar.ai { background: var(--surface2); border: 1px solid var(--border); color: var(--text2); }
    .msg-avatar.user-av { background: var(--accent); color: #fff; }

    .msg-body { display: flex; flex-direction: column; max-width: 78%; }

    .msg-bubble {
      padding: 10px 14px;
      border-radius: var(--radius);
      font-size: 14px;
      line-height: 1.6;
    }

    .msg-row.user .msg-bubble {
      background: var(--accent);
      color: #fff;
      border-radius: var(--radius) var(--radius) 2px var(--radius);
    }

    .msg-row.ai .msg-bubble {
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: var(--radius) var(--radius) var(--radius) 2px;
    }

    /* Markdown inside bubbles */
    .msg-bubble.markdown p { margin-bottom: 8px; }
    .msg-bubble.markdown p:last-child { margin-bottom: 0; }
    .msg-bubble.markdown h1, .msg-bubble.markdown h2, .msg-bubble.markdown h3 { margin: 10px 0 4px; font-weight: 600; }
    .msg-bubble.markdown ul, .msg-bubble.markdown ol { padding-left: 18px; margin-bottom: 8px; }
    .msg-bubble.markdown li { margin-bottom: 2px; }
    .msg-bubble.markdown code { font-family: 'JetBrains Mono', monospace; font-size: 12px; background: var(--surface2); padding: 1px 5px; border-radius: 4px; }
    .msg-bubble.markdown pre { background: var(--surface2); border-radius: var(--radius-sm); padding: 10px; overflow-x: auto; margin: 8px 0; }
    .msg-bubble.markdown pre code { background: none; padding: 0; }
    .msg-bubble.markdown blockquote { border-left: 2px solid var(--accent); padding-left: 10px; color: var(--text2); margin: 6px 0; }
    .msg-bubble.markdown a { color: var(--accent); text-decoration: underline; }
    .msg-bubble.markdown table { width: 100%; border-collapse: collapse; margin: 8px 0; font-size: 13px; }
    .msg-bubble.markdown th { background: var(--surface2); border: 1px solid var(--border); padding: 6px 10px; font-weight: 600; }
    .msg-bubble.markdown td { border: 1px solid var(--border); padding: 6px 10px; }

    .sources-toggle {
      margin-top: 6px;
      font-size: 11px;
      color: var(--accent);
      font-family: 'JetBrains Mono', monospace;
      cursor: pointer;
      background: none;
      border: none;
      padding: 0;
      text-align: left;
    }

    .sources-toggle:hover { text-decoration: underline; }

    .sources-panel { margin-top: 6px; display: flex; flex-direction: column; gap: 4px; }
    .source-chip {
      font-size: 11px;
      font-family: 'JetBrains Mono', monospace;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 5px;
      padding: 4px 8px;
      color: var(--text2);
    }

    /* Typing dots */
    .typing-dots { display: flex; gap: 5px; align-items: center; padding: 10px 14px; }
    .typing-dots span {
      width: 6px; height: 6px;
      background: var(--text3);
      border-radius: 50%;
      animation: bounce 1.2s ease-in-out infinite;
    }
    .typing-dots span:nth-child(2) { animation-delay: 0.2s; }
    .typing-dots span:nth-child(3) { animation-delay: 0.4s; }
    @keyframes bounce { 0%, 80%, 100% { transform: translateY(0); } 40% { transform: translateY(-5px); } }

    .empty-chat { margin: auto; text-align: center; color: var(--text3); }
    .empty-chat svg { margin-bottom: 12px; opacity: 0.4; }
    .empty-chat p { font-size: 14px; }

    /* ── Input Area ── */
    #chat-footer {
      background: var(--surface);
      border-top: 1px solid var(--border);
      padding: 14px 20px;
      flex-shrink: 0;
    }

    .input-wrap {
      display: flex;
      align-items: flex-end;
      gap: 10px;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 10px 12px;
      transition: border-color 0.15s;
    }

    .input-wrap:focus-within { border-color: var(--accent); }

    #chat-input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      font-family: 'DM Sans', sans-serif;
      font-size: 14px;
      color: var(--text);
      resize: none;
      min-height: 22px;
      max-height: 140px;
      line-height: 1.5;
    }

    #chat-input::placeholder { color: var(--text3); }

    #btn-send {
      width: 36px; height: 36px;
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: var(--radius-sm);
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
      transition: background 0.15s, opacity 0.15s;
    }

    #btn-send:hover { background: var(--accent-hover); }
    #btn-send:disabled { opacity: 0.5; cursor: not-allowed; }

    #chat-hint { font-size: 11px; color: var(--text3); text-align: center; margin-top: 8px; }

    /* ── Empty State ── */
    #empty-state {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      color: var(--text3);
    }

    #empty-state svg { opacity: 0.3; }
    #empty-state p { font-size: 14px; color: var(--text3); }

    /* ── Modal ── */
    #modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.45);
      backdrop-filter: blur(4px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 100;
      padding: 16px;
    }

    #modal-overlay.open { display: flex; }

    .modal {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 28px;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.2);
    }

    .modal h3 { font-size: 16px; font-weight: 600; margin-bottom: 20px; color: var(--text); }

    .form-group { margin-bottom: 16px; }
    .form-label { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.6px; color: var(--text3); display: block; margin-bottom: 6px; }

    .form-input {
      width: 100%;
      padding: 9px 12px;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      font-family: 'DM Sans', sans-serif;
      font-size: 14px;
      color: var(--text);
      outline: none;
      transition: border-color 0.15s;
    }

    .form-input:focus { border-color: var(--accent); }
    .form-input::placeholder { color: var(--text3); }

    .modal-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 24px; }

    .btn-cancel {
      padding: 9px 18px;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      font-family: 'DM Sans', sans-serif;
      font-size: 13px;
      font-weight: 500;
      color: var(--text2);
      cursor: pointer;
      transition: all 0.12s;
    }

    .btn-cancel:hover { background: var(--border); }

    .btn-primary {
      padding: 9px 18px;
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: var(--radius-sm);
      font-family: 'DM Sans', sans-serif;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.15s;
    }

    .btn-primary:hover { background: var(--accent-hover); }

    /* ── Toast ── */
    #toast-container {
      position: fixed;
      bottom: 20px;
      right: 20px;
      z-index: 999;
      display: flex;
      flex-direction: column;
      gap: 8px;
      pointer-events: none;
    }

    .toast {
      padding: 10px 14px;
      border-radius: var(--radius);
      font-size: 13px;
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 8px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.15);
      animation: slideIn 0.2s ease;
      pointer-events: auto;
    }

    @keyframes slideIn { from { transform: translateX(20px); opacity: 0; } to { transform: translateX(0); opacity: 1; } }

    .toast.success { background: var(--green-bg); color: var(--green); border: 1px solid var(--green); }
    .toast.error { background: var(--red-bg); color: var(--red); border: 1px solid var(--red); }
    .toast.info { background: var(--accent-light); color: var(--accent-text); border: 1px solid var(--accent); }

    /* Spinner */
    @keyframes spin { to { transform: rotate(360deg); } }
    .spinner { animation: spin 0.8s linear infinite; }

    /* Responsive */
    @media (max-width: 640px) {
      :root { --sidebar-w: 100vw; }
      #sidebar { position: fixed; left: -100vw; top: 0; bottom: 0; z-index: 50; transition: left 0.25s ease; }
      #sidebar.open { left: 0; }
      .mobile-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 49; }
      .mobile-overlay.open { display: block; }
      #btn-menu { display: flex !important; }
      #messages { padding: 16px 12px; }
      #tab-files.active { padding: 16px; }
      #chat-footer { padding: 10px 12px; }
    }

    @media (min-width: 641px) {
      #btn-menu { display: none !important; }
    }
  </style>
</head>
<body>

<div id="mobile-overlay" class="mobile-overlay" onclick="closeSidebar()"></div>

<div id="app">
  <!-- Sidebar -->
  <div id="sidebar">
    <div class="sidebar-head">
      <div class="logo">
        <div class="logo-icon">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/></svg>
        </div>
        <h1>RAG Agents</h1>
        <button class="btn-icon" id="theme-btn" onclick="toggleTheme()" title="Toggle theme" style="margin-left:auto;width:30px;height:30px;border:none;">
          <svg id="sun-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display:none"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>
          <svg id="moon-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
        </button>
      </div>
      <div class="logo-sub">multi-agent system</div>
    </div>

    <div class="sidebar-actions">
      <button id="btn-new-agent" onclick="openCreateModal()">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        New Agent
      </button>
    </div>

    <div class="sidebar-section-label">Agents</div>

    <div id="agents-list">
      <div class="no-agents">No agents yet</div>
    </div>

    <div class="sidebar-footer">
      <label>Backend URL</label>
      <input id="api-url" value="http://localhost:8000" placeholder="http://localhost:8000" />
    </div>
  </div>

  <!-- Main -->
  <div id="main">
    <!-- Empty State -->
    <div id="empty-state">
      <svg width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/></svg>
      <p>Select or create an agent to get started</p>
    </div>

    <!-- Agent Page -->
    <div id="agent-page" style="display:none; flex-direction:column; height:100%; overflow:hidden;">

      <!-- Topbar -->
      <div id="topbar">
        <button class="btn-icon" id="btn-menu" onclick="openSidebar()">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
        </button>
        <div id="agent-avatar-hdr">AG</div>
        <div>
          <div id="agent-name-hdr">Agent Name</div>
          <div id="agent-id-hdr">id…</div>
        </div>
        <div class="topbar-right">
          <button class="btn-icon danger" onclick="deleteCurrentAgent()" title="Delete agent">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14H6L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4h6v2"/></svg>
          </button>
        </div>
      </div>

      <!-- Tabs -->
      <div id="tabs">
        <button class="tab-btn active" id="tab-files-btn" onclick="switchTab('files')">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
          Files & Index
        </button>
        <button class="tab-btn" id="tab-chat-btn" onclick="switchTab('chat')">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"/></svg>
          Chat
        </button>
      </div>

      <!-- Files Tab -->
      <div id="tab-files" class="tab-content active">
        <div class="index-bar">
          <div class="index-status">
            <div class="index-dot" id="index-dot"></div>
            <span class="index-status-text" id="index-status-text">Not indexed</span>
          </div>
          <span class="index-chunks" id="index-chunks"></span>
          <button id="btn-index" onclick="buildIndex()">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16v16H4z"/><path d="M4 9h16"/><path d="M9 4v16"/></svg>
            Build Index
          </button>
        </div>

        <div class="section-label">Upload Files</div>
        <div class="upload-zone" id="upload-zone"
          onclick="document.getElementById('file-input').click()"
          ondragover="onDragOver(event)"
          ondragleave="onDragLeave(event)"
          ondrop="onDrop(event)">
          <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
          <p>Click or drag files here</p>
          <small>.pdf .txt .md .csv .html .docx</small>
        </div>
        <input type="file" id="file-input" multiple accept=".pdf,.txt,.md,.csv,.html,.htm,.docx" onchange="handleFileUpload(this.files)" style="display:none"/>

        <div class="section-label" style="margin-top:4px">
          Indexed Files <span id="file-count" style="font-weight:400;font-family:'JetBrains Mono',monospace;"></span>
        </div>
        <div id="files-grid"></div>
      </div>

      <!-- Chat Tab -->
      <div id="tab-chat" class="tab-content">
        <div class="conv-bar">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"/></svg>
          <select id="conv-select" onchange="loadConversation(this.value)">
            <option value="">New conversation</option>
          </select>
          <button class="btn-sm" onclick="newConversation()">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
            New
          </button>
        </div>

        <!-- SCROLLABLE MESSAGE AREA -->
        <div id="messages">
          <div class="empty-chat">
            <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"/></svg>
            <p>Start a conversation…</p>
          </div>
        </div>

        <!-- Input -->
        <div id="chat-footer">
          <div class="input-wrap">
            <textarea id="chat-input" rows="1" placeholder="Ask anything about your documents…"
              onkeydown="handleChatKey(event)"
              oninput="autoResize(this)"></textarea>
            <button id="btn-send" onclick="sendMessage()">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
            </button>
          </div>
          <p id="chat-hint">Index documents first to start chatting</p>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Modal -->
<div id="modal-overlay" onclick="handleModalOverlayClick(event)">
  <div class="modal">
    <h3>Create New Agent</h3>
    <div class="form-group">
      <label class="form-label">Agent Name *</label>
      <input id="modal-name" class="form-input" placeholder="e.g. Customer Support Bot" onkeydown="if(event.key==='Enter') createAgent()"/>
    </div>
    <div class="form-group">
      <label class="form-label">Description</label>
      <input id="modal-desc" class="form-input" placeholder="What does this agent know about?"/>
    </div>
    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeModal()">Cancel</button>
      <button class="btn-primary" onclick="createAgent()">Create Agent</button>
    </div>
  </div>
</div>

<!-- Toast -->
<div id="toast-container"></div>

<script>
const state = {
  agents: [], currentAgent: null,
  conversationId: null, conversations: [],
  messages: [], indexReady: false,
  sending: false
};

function API() { return document.getElementById('api-url').value.trim().replace(/\/$/, ''); }

/* ── Theme ── */
function initTheme() {
  const t = localStorage.getItem('rag-theme') || 'light';
  document.documentElement.className = t;
  updateThemeIcons();
}

function toggleTheme() {
  const isDark = document.documentElement.classList.toggle('dark');
  document.documentElement.classList.toggle('light', !isDark);
  localStorage.setItem('rag-theme', isDark ? 'dark' : 'light');
  updateThemeIcons();
}

function updateThemeIcons() {
  const isDark = document.documentElement.classList.contains('dark');
  document.getElementById('sun-icon').style.display = isDark ? '' : 'none';
  document.getElementById('moon-icon').style.display = isDark ? 'none' : '';
}

/* ── Mobile sidebar ── */
function openSidebar() {
  document.getElementById('sidebar').classList.add('open');
  document.getElementById('mobile-overlay').classList.add('open');
}
function closeSidebar() {
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('mobile-overlay').classList.remove('open');
}

/* ── Toast ── */
function toast(msg, type='info', dur=3000) {
  const icons = { success:'✓', error:'✗', info:'ℹ' };
  const el = document.createElement('div');
  el.className = `toast ${type}`;
  el.innerHTML = `<span>${icons[type]}</span><span>${msg}</span>`;
  document.getElementById('toast-container').appendChild(el);
  setTimeout(() => el.remove(), dur);
}

/* ── Modal ── */
function openCreateModal() {
  document.getElementById('modal-name').value = '';
  document.getElementById('modal-desc').value = '';
  document.getElementById('modal-overlay').classList.add('open');
  setTimeout(() => document.getElementById('modal-name').focus(), 100);
}

function closeModal() {
  document.getElementById('modal-overlay').classList.remove('open');
}

function handleModalOverlayClick(e) {
  if (e.target === document.getElementById('modal-overlay')) closeModal();
}

/* ── Agents ── */
async function loadAgents() {
  try {
    const res = await fetch(`${API()}/agents`);
    const data = await res.json();
    state.agents = data.agents || [];
    renderSidebar();
  } catch(e) { toast('Cannot connect to backend', 'error'); }
}

function renderSidebar() {
  const list = document.getElementById('agents-list');
  if (!state.agents.length) {
    list.innerHTML = `<div class="no-agents">No agents yet</div>`;
    return;
  }
  list.innerHTML = state.agents.map(a => {
    const initials = a.agent_name.substring(0,2).toUpperCase();
    const isActive = state.currentAgent?.agent_id === a.agent_id;
    return `
      <div class="agent-item ${isActive ? 'active' : ''}" onclick="selectAgent('${a.agent_id}')">
        <div class="agent-avatar">${initials}</div>
        <div class="agent-meta">
          <div class="agent-name">${escHtml(a.agent_name)}</div>
          <div class="agent-id">${a.agent_id.substring(0,8)}…</div>
        </div>
        <div class="agent-status" id="dot-${a.agent_id}"></div>
      </div>`;
  }).join('');
}

async function createAgent() {
  const name = document.getElementById('modal-name').value.trim();
  if (!name) { toast('Enter an agent name', 'error'); return; }
  const desc = document.getElementById('modal-desc').value.trim();
  try {
    const res = await fetch(`${API()}/agents`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ agent_name: name, description: desc })
    });
    const data = await res.json();
    closeModal();
    toast(`Agent "${name}" created`, 'success');
    await loadAgents();
    selectAgent(data.agent_id);
  } catch(e) { toast('Failed to create agent', 'error'); }
}

async function selectAgent(agentId) {
  const agent = state.agents.find(a => a.agent_id === agentId);
  if (!agent) return;
  state.currentAgent = agent;
  state.conversationId = null;
  state.messages = [];
  state.conversations = [];
  renderSidebar();
  closeSidebar();

  document.getElementById('empty-state').style.display = 'none';
  document.getElementById('agent-page').style.display = 'flex';

  const initials = agent.agent_name.substring(0,2).toUpperCase();
  document.getElementById('agent-avatar-hdr').textContent = initials;
  document.getElementById('agent-name-hdr').textContent = agent.agent_name;
  document.getElementById('agent-id-hdr').textContent = agent.agent_id;

  switchTab('files');
  await refreshStatus();
  await refreshFiles();
  await loadConversations();
}

async function deleteCurrentAgent() {
  if (!state.currentAgent) return;
  if (!confirm(`Delete agent "${state.currentAgent.agent_name}"? This is irreversible.`)) return;
  try {
    await fetch(`${API()}/agents/${state.currentAgent.agent_id}`, { method: 'DELETE' });
    toast('Agent deleted', 'success');
    state.currentAgent = null;
    document.getElementById('agent-page').style.display = 'none';
    document.getElementById('empty-state').style.display = 'flex';
    await loadAgents();
  } catch(e) { toast('Failed to delete agent', 'error'); }
}

/* ── Tabs ── */
function switchTab(tab) {
  ['files','chat'].forEach(t => {
    document.getElementById(`tab-${t}`).classList.toggle('active', t === tab);
    document.getElementById(`tab-${t}-btn`).classList.toggle('active', t === tab);
  });
  if (tab === 'chat') { renderMessages(); scrollToBottom(); }
}

/* ── Status ── */
async function refreshStatus() {
  if (!state.currentAgent) return;
  try {
    const res = await fetch(`${API()}/agents/${state.currentAgent.agent_id}/status`);
    const data = await res.json();
    const ready = data.state === 'ready';
    state.indexReady = ready;

    const dot = document.getElementById('index-dot');
    const text = document.getElementById('index-status-text');
    const chunks = document.getElementById('index-chunks');

    if (dot) { dot.className = `index-dot${ready ? ' ready' : ''}`; }
    if (text) { text.textContent = ready ? 'Index ready' : 'Not indexed'; text.className = `index-status-text${ready ? ' ready' : ''}`; }
    if (chunks) { chunks.textContent = ready ? `${data.total_chunks} chunks · ${(data.files||[]).length} files` : ''; }

    const sideDot = document.getElementById(`dot-${state.currentAgent.agent_id}`);
    if (sideDot) { sideDot.className = `agent-status${ready ? ' ready' : ''}`; }

    const hint = document.getElementById('chat-hint');
    if (hint) { hint.textContent = ready ? 'Press Enter or click Send' : 'Index documents first to start chatting'; }
  } catch(e) {}
}

/* ── Files ── */
async function refreshFiles() {
  if (!state.currentAgent) return;
  try {
    const res = await fetch(`${API()}/agents/${state.currentAgent.agent_id}/files`);
    const data = await res.json();
    renderFiles(data.files || []);
  } catch(e) {}
}

function renderFiles(files) {
  const grid = document.getElementById('files-grid');
  const count = document.getElementById('file-count');
  if (count) count.textContent = files.length ? `(${files.length})` : '';
  if (!files.length) {
    grid.innerHTML = `<div style="color:var(--text3);font-size:13px;padding:16px 0;text-align:center;">No files uploaded yet</div>`;
    return;
  }
  const extClass = { pdf:'ext-pdf', txt:'ext-txt', md:'ext-md', csv:'ext-csv', html:'ext-html', htm:'ext-htm', docx:'ext-docx' };
  grid.innerHTML = files.map(f => {
    const ext = f.extension.replace('.','');
    return `
      <div class="file-item">
        <span class="file-ext ${extClass[ext] || 'ext-default'}">${ext.toUpperCase()}</span>
        <span class="file-name">${escHtml(f.filename)}</span>
        <span class="file-size">${f.size_kb} KB</span>
        <button class="btn-delete-file" onclick="deleteFile('${escHtml(f.filename)}')" title="Delete">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14H6L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4h6v2"/></svg>
        </button>
      </div>`;
  }).join('');
}

function onDragOver(e) { e.preventDefault(); document.getElementById('upload-zone').classList.add('dragover'); }
function onDragLeave() { document.getElementById('upload-zone').classList.remove('dragover'); }
function onDrop(e) { e.preventDefault(); document.getElementById('upload-zone').classList.remove('dragover'); handleFileUpload(e.dataTransfer.files); }

async function handleFileUpload(fileList) {
  if (!state.currentAgent || !fileList.length) return;
  const form = new FormData();
  Array.from(fileList).forEach(f => form.append('files', f));
  toast('Uploading…', 'info');
  try {
    const res = await fetch(`${API()}/agents/${state.currentAgent.agent_id}/upload`, { method: 'POST', body: form });
    const data = await res.json();
    if (data.uploaded?.length) { toast(`Uploaded ${data.uploaded.length} file(s)`, 'success'); await refreshFiles(); await buildIndex(); }
    if (data.skipped?.length) data.skipped.forEach(s => toast(`Skipped: ${s.filename} — ${s.reason}`, 'error'));
  } catch(e) { toast('Upload failed', 'error'); }
  document.getElementById('file-input').value = '';
}

async function deleteFile(filename) {
  if (!state.currentAgent) return;
  try {
    await fetch(`${API()}/agents/${state.currentAgent.agent_id}/files/${encodeURIComponent(filename)}`, { method: 'DELETE' });
    toast(`"${filename}" deleted`, 'success');
    await refreshFiles();
  } catch(e) { toast('Failed to delete file', 'error'); }
}

/* ── Index ── */
async function buildIndex() {
  if (!state.currentAgent) return;
  const btn = document.getElementById('btn-index');
  if (btn) {
    btn.disabled = true;
    btn.innerHTML = `<svg class="spinner" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12a9 9 0 11-6.219-8.56"/></svg> Indexing…`;
  }
  toast('Building index…', 'info');
  try {
    const res = await fetch(`${API()}/agents/${state.currentAgent.agent_id}/index`, { method: 'POST' });
    if (!res.ok) { const err = await res.json(); throw new Error(err.detail || 'Index failed'); }
    const data = await res.json();
    toast(`Index ready — ${data.total_chunks} chunks`, 'success');
    await refreshStatus();
  } catch(e) { toast(e.message || 'Failed to build index', 'error'); }
  if (btn) {
    btn.disabled = false;
    btn.innerHTML = `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16v16H4z"/><path d="M4 9h16"/><path d="M9 4v16"/></svg> Build Index`;
  }
}

/* ── Conversations ── */
async function loadConversations() {
  if (!state.currentAgent) return;
  try {
    const res = await fetch(`${API()}/agents/${state.currentAgent.agent_id}/conversations`);
    const data = await res.json();
    state.conversations = data.conversations || [];
    renderConvSelect();
  } catch(e) {}
}

function renderConvSelect() {
  const sel = document.getElementById('conv-select');
  if (!sel) return;
  sel.innerHTML = `<option value="">New conversation</option>` +
    state.conversations.map(c =>
      `<option value="${c.conversation_id}" ${state.conversationId === c.conversation_id ? 'selected' : ''}>${c.conversation_id.substring(0,8)}… (${c.message_count} msgs)</option>`
    ).join('');
}

async function loadConversation(convId) {
  if (!convId) { newConversation(); return; }
  if (!state.currentAgent) return;
  try {
    const res = await fetch(`${API()}/agents/${state.currentAgent.agent_id}/conversations/${convId}`);
    const data = await res.json();
    state.conversationId = convId;
    state.messages = data.messages || [];
    renderMessages();
    scrollToBottom();
  } catch(e) { toast('Failed to load conversation', 'error'); }
}

function newConversation() {
  state.conversationId = null;
  state.messages = [];
  renderMessages();
  renderConvSelect();
}

/* ── Chat ── */
function renderMessages() {
  const container = document.getElementById('messages');
  if (!container) return;
  if (!state.messages.length) {
    container.innerHTML = `<div class="empty-chat"><svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"/></svg><p>Start a conversation…</p></div>`;
    return;
  }
  container.innerHTML = state.messages.map(m => {
    const isUser = m.role === 'user';
    const sources = m.sources;
    const sourcesHtml = sources ? `
      <button class="sources-toggle" onclick="toggleSources(this)">▸ ${sources.length} source(s)</button>
      <div class="sources-panel" style="display:none">
        ${sources.map(s => `<div class="source-chip">${escHtml(s.source)} · p${s.page} · ${s.score.toFixed(2)}</div>`).join('')}
      </div>` : '';

    const contentHtml = isUser
      ? escHtml(m.content).replace(/\n/g, '<br>')
      : `<div class="markdown">${marked.parse(m.content)}</div>`;

    return `
      <div class="msg-row ${isUser ? 'user' : 'ai'}">
        <div class="msg-avatar ${isUser ? 'user-av' : 'ai'}">${isUser ? 'U' : 'AI'}</div>
        <div class="msg-body">
          <div class="msg-bubble ${isUser ? '' : 'markdown'}">${contentHtml}</div>
          ${!isUser ? sourcesHtml : ''}
        </div>
      </div>`;
  }).join('');
}

function toggleSources(btn) {
  const panel = btn.nextElementSibling;
  const open = panel.style.display !== 'none';
  panel.style.display = open ? 'none' : 'flex';
  btn.textContent = (open ? '▸' : '▾') + btn.textContent.slice(1);
}

function scrollToBottom() {
  const el = document.getElementById('messages');
  if (el) setTimeout(() => { el.scrollTop = el.scrollHeight; }, 50);
}

function handleChatKey(e) {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
}

function autoResize(el) {
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 140) + 'px';
}

async function sendMessage() {
  const input = document.getElementById('chat-input');
  const question = input.value.trim();
  if (!question || state.sending || !state.currentAgent) return;
  if (!state.indexReady) { toast('Please build the index first', 'error'); return; }

  state.sending = true;
  input.value = '';
  input.style.height = 'auto';
  document.getElementById('btn-send').disabled = true;

  state.messages.push({ role: 'user', content: question });
  renderMessages();
  scrollToBottom();

  const container = document.getElementById('messages');
  const typingEl = document.createElement('div');
  typingEl.className = 'msg-row ai';
  typingEl.id = 'typing-indicator';
  typingEl.innerHTML = `
    <div class="msg-avatar ai">AI</div>
    <div class="msg-body">
      <div class="msg-bubble">
        <div class="typing-dots"><span></span><span></span><span></span></div>
      </div>
    </div>`;
  container.appendChild(typingEl);
  scrollToBottom();

  try {
    const res = await fetch(`${API()}/agents/${state.currentAgent.agent_id}/query`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ question, conversation_id: state.conversationId || null, top_k: 5, temperature: 0.0 })
    });
    if (!res.ok) { const err = await res.json(); throw new Error(err.detail || 'Query failed'); }
    const data = await res.json();
    if (!state.conversationId) { state.conversationId = data.conversation_id; await loadConversations(); }
    state.messages.push({ role: 'assistant', content: data.answer, sources: data.sources });
  } catch(e) {
    state.messages.push({ role: 'assistant', content: `Error: ${e.message}` });
    toast(e.message, 'error');
  }

  document.getElementById('typing-indicator')?.remove();
  renderMessages();
  scrollToBottom();
  state.sending = false;
  document.getElementById('btn-send').disabled = false;
  input.focus();
}

function escHtml(str) {
  return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

/* ── Init ── */
initTheme();
loadAgents();
setInterval(loadAgents, 30000);
</script>
</body>
</html>
